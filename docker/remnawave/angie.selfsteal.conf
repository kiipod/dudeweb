user angie;
worker_processes auto;
worker_rlimit_nofile 65536;

error_log /var/log/angie/error.log warn;
pid /run/angie/angie.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/angie/mime.types;
    default_type application/octet-stream;

    types_hash_max_size 2048;

    # ---------------- Logs ----------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format proxy_protocol '$proxy_protocol_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent"';

    access_log /var/log/angie/access.log main;

    # ---------------- Performance ----------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # ---------------- Gzip ----------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ---------------- ACME + fallback ----------------
    acme_client letsencrypt https://acme-v02.api.letsencrypt.org/directory;
    resolver 127.0.0.53;

    map $acme_cert_letsencrypt $cert_letsencrypt {
        '' /etc/angie/certs/cert.pem;
        default  $acme_cert_letsencrypt;
    }

    map $acme_cert_letsencrypt $cert_key_letsencrypt {
        '' /etc/angie/certs/key.pem;
        default  $acme_cert_key_letsencrypt;
    }

    # =================================================
    # HTTP :80 — ACME + redirect
    # =================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name game.dudeweb.xyz;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =================================================
    # HTTPS via Unix socket
    # =================================================
    server {
        listen unix:/dev/shm/angie.sock ssl proxy_protocol;
        server_name game.dudeweb.xyz;

        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        acme letsencrypt;
        ssl_certificate $cert_letsencrypt;
        ssl_certificate_key $cert_key_letsencrypt;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_prefer_server_ciphers off;

        access_log /var/log/angie/access.log proxy_protocol;

        root /var/www/html;
        index index.html index.htm;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # =================================================
    # HTTPS via Xhttp
    # =================================================
    server {
        listen [::]:443 ssl reuseport ipv6only=off;
        listen [::]:443 quic reuseport ipv6only=off;
        server_name game.dudeweb.xyz xh.dudeweb.xyz;

        root /var/www/html;
        index index.html;

        http2 on;

        acme letsencrypt;
        ssl_certificate $cert_letsencrypt;
        ssl_certificate_key $cert_key_letsencrypt;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        location /xrxh {
            client_max_body_size 0;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_read_timeout 315s;
            grpc_send_timeout 5m;
            grpc_pass unix:/dev/shm/xrxh.socket;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
