upstream remnawave {
    server remnawave:3000;
}

upstream remnawave-subscription-page {
    server remnawave-subscription-page:3010;
}

resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4;

acme_client acme_le https://acme-v02.api.letsencrypt.org/directory;

server {
    server_name panel.dudeweb.xyz sub.dudeweb.xyz;

    listen 443 ssl reuseport;
    listen [::]:443 ssl reuseport;
    http2 on;

    acme acme_le;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305";

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:1m;
    ssl_session_tickets off;

    ssl_certificate     $acme_cert_acme_le;
    ssl_certificate_key $acme_cert_key_acme_le;

    location / {
        proxy_http_version 1.1;

        if ($host = "panel.dudeweb.xyz") {
            proxy_pass http://remnawave;
        }

        if ($host = "sub.dudeweb.xyz") {
            proxy_pass http://remnawave-subscription-page;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/json
        text/css
        text/javascript
        text/plain
        application/javascript
        image/svg+xml;
}

server {
    listen 80;
    return 444;
}
