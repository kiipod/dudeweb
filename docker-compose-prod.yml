version: '3.9'

networks:
  dude-network:

services:
  caddy:
    container_name: caddy
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - dude-network
    volumes:
      - ./:/app
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    container_name: app
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    restart: unless-stopped
    networks:
      - dude-network
    volumes:
      - ./:/app
      - ./storage:/app/storage

  pgsql:
    container_name: pgsql
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: verysecret
      POSTGRES_DB: dudeweb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    networks:
      - dude-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
